name: Check latest feed importer

on:
  pull_request:
    paths:
      - scripts/build_latest_investigations.py
      - scripts/test_latest_investigations.py
      - .github/workflows/latest-investigations.yml
      - .github/workflows/latest-feed-check.yml
      - scripts/test_latest_feed_render.js
      - index.html
      - latest-investigations.json
  push:
    branches: [main]
    paths:
      - scripts/build_latest_investigations.py
      - scripts/test_latest_investigations.py
      - .github/workflows/latest-investigations.yml
      - .github/workflows/latest-feed-check.yml
      - scripts/test_latest_feed_render.js
      - index.html
      - latest-investigations.json

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s scripts -p 'test_latest_investigations.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:feed
