name: Check installable web app

on:
  pull_request:
    paths:
      - manifest.json
      - index.html
      - '*icon*'
      - browserconfig.xml
      - _headers
      - package.json
      - scripts/audit_pwa.py
      - .github/workflows/pwa-check.yml
  push:
    branches: [main]
    paths:
      - manifest.json
      - index.html
      - '*icon*'
      - browserconfig.xml
      - _headers
      - package.json
      - scripts/audit_pwa.py
      - .github/workflows/pwa-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/audit_pwa.py
