name: Check Markdown companions

on:
  pull_request:
    paths:
      - index.html
      - about/index.html
      - corrections/index.html
      - analytics/index.html
      - team/index.html
      - ai-use/index.html
      - index.md
      - about/index.md
      - corrections/index.md
      - analytics/index.md
      - team/index.md
      - ai-use/index.md
      - scripts/build_markdown.js
      - package.json
      - package-lock.json
  push:
    branches: [main]
    paths:
      - index.html
      - about/index.html
      - corrections/index.html
      - analytics/index.html
      - team/index.html
      - ai-use/index.html
      - index.md
      - about/index.md
      - corrections/index.md
      - analytics/index.md
      - team/index.md
      - ai-use/index.md
      - scripts/build_markdown.js
      - package.json
      - package-lock.json

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:markdown
